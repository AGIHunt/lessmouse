<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <!-- LessMouse menu bar mark (source of truth).

       A keycap with a small filled dot at its lower right: "keyboard +
       notification" in one glyph. Alpha-only template art — macOS colors it
       for the light or dark menu bar, which is why there is no fill color
       here. Derived into Resources/MenuBarIcon.png (36px = 18pt @2x) by
       scripts/make-icons.swift. -->
  <g fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round">
    <rect x="3" y="4.5" width="12" height="10.5" rx="2.5"/>
  </g>
  <circle cx="12.9" cy="11.4" r="1.8" fill="#000"/>
</svg>
