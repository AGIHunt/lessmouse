<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <!-- LessMouse menu bar mark (source of truth).

       The command glyph itself, matching the app icon. The first design was
       a keycap outline with a notification dot, which at 18pt read as an
       empty box — the product is about ⌘, so the mark is ⌘. (The unread dot
       is a SwiftUI overlay in App.swift, not part of this art.)

       Alpha-only template art: macOS colors it for the light or dark menu
       bar. Pixels are derived by scripts/make-icons.swift (CoreText,
       HelveticaNeue at 14.5pt in the 18pt slot); this SVG is the human
       reference, the script is authoritative. -->
  <text x="9" y="9" font-family="Helvetica Neue" font-size="14.5"
        fill="#000" text-anchor="middle" dominant-baseline="central">&#8984;</text>
</svg>
